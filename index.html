<style>
:root{--g:#F2B968;--bg:#0E0B09;--c:#1C1511;--t:#F5ECE0;--m:#A89A8A;--l:#3A2C20}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--t);font:15px/1.5 -apple-system,"PingFang SC",sans-serif}
h1,h2,p{margin:0}.m{color:var(--m);font-size:12px}.row{display:flex;gap:10px;align-items:center}
.view{display:none;padding:calc(env(safe-area-inset-top) + 18px) 16px 110px;min-height:100vh;flex-direction:column;gap:14px}.view.on{display:flex}
.card{background:var(--c);border:1px solid var(--l);border-radius:20px;padding:14px}
.btn{min-height:44px;border-radius:22px;border:1px solid #4A3828;background:#241A13;color:var(--t);padding:0 16px;font:inherit;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.gold{background:linear-gradient(#F7C77E,#E39A3E);color:#2A1706;border:0;font-weight:700}.danger{color:#F29A8A;border-color:#7A3A2E}.on2{border-color:var(--g);color:var(--g)}
#tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:#150F0B;border-top:1px solid var(--l);padding:6px 0 calc(env(safe-area-inset-bottom) + 6px);z-index:20}
#tabs button{flex:1;background:none;border:0;color:var(--m);font:inherit;font-size:12px;min-height:48px}#tabs button.on{color:var(--g);font-weight:700}

.hero h1{font-size:32px;letter-spacing:2px;color:#FFE2B8}
.ent{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.ent button{border:1px solid #6A4A2A;border-radius:18px;min-height:0;aspect-ratio:0.98/1;color:transparent;font:inherit;font-weight:700;display:block;padding:0;text-align:left;overflow:hidden;background-color:#1C1511;background-position:center;background-size:cover;background-repeat:no-repeat;box-shadow:0 7px 18px #0008}.ent button:focus-visible{outline:2px solid var(--g);outline-offset:3px}.ent small{display:none}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.po{background:none;border:0;color:var(--t);font:inherit;text-align:left;padding:0}
.im{aspect-ratio:2/3;border-radius:14px;background:#2A1D14 center/cover;display:flex;align-items:flex-end;justify-content:flex-end;padding:6px;font-size:11px;border:1px solid var(--l)}.po b{display:block;font-size:13px;font-weight:600;margin-top:4px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
input[type=range]{width:100%;accent-color:var(--g)}input[type=search],input[type=text]{width:100%;min-height:44px;border-radius:22px;border:1px solid #4A3828;background:#1C1511;color:var(--t);padding:0 16px;font:inherit}
.bar{height:5px;border-radius:3px;background:#3A2C20}.bar i{display:block;height:5px;border-radius:3px;background:var(--g)}
.vin{width:200px;height:200px;border-radius:50%;margin:6px auto;background:radial-gradient(circle,#F2B968 0 14%,#2A1B30 15% 38%,#120A18 39%);border:1px solid #6A3A7A;display:flex;align-items:center;justify-content:center;font-size:44px;color:#F2B968}
.spin{animation:sp 8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chips .btn{padding:0 14px;min-height:40px}
.song{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #2A1F16}.song .nm{flex:1;min-width:0;background:none;border:0;color:var(--t);font:inherit;text-align:left;padding:8px 0}.nm b{display:block;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#toast{position:fixed;top:calc(env(safe-area-inset-top) + 12px);left:50%;transform:translateX(-50%);background:#F2B968;color:#2A1706;padding:8px 16px;border-radius:20px;z-index:99;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%}
.rd{display:inline-block;width:10px;height:10px;border-radius:5px;background:#E5483A;margin-right:6px}



/* ===== iPhone / mobile layout stabilization ===== */
html{min-height:100%;background:var(--bg);-webkit-text-size-adjust:100%;}
body{min-height:100dvh;overflow-x:hidden;padding-bottom:env(safe-area-inset-bottom);}
.view{width:100%;min-width:0;min-height:100dvh;padding-top:calc(env(safe-area-inset-top) + 14px);padding-left:clamp(12px,4vw,20px);padding-right:clamp(12px,4vw,20px);padding-bottom:calc(86px + env(safe-area-inset-bottom));gap:clamp(11px,3vw,16px);}
#tabs{padding-top:7px;padding-bottom:calc(7px + env(safe-area-inset-bottom));min-height:calc(62px + env(safe-area-inset-bottom));}
#tabs button{min-width:0;min-height:48px;padding:2px 0;white-space:nowrap;font-size:clamp(11px,3vw,13px);}
.hero{width:100%;height:auto;min-height:0;aspect-ratio:16/9;max-height:250px;border-radius:20px;background-position:center;background-size:cover;flex:0 0 auto;}
.ent{width:100%;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(7px,2.2vw,10px);}
.ent button{width:100%;min-width:0;aspect-ratio:1/1.04;border-radius:clamp(12px,3.5vw,18px);background-size:cover;background-position:center;}
.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(7px,2.4vw,10px);}
.po{min-width:0;overflow:hidden;}
.po b{font-size:clamp(11px,3.2vw,13px);}
.row{min-width:0;flex-wrap:wrap;}
.btn{max-width:100%;white-space:normal;line-height:1.25;text-align:center;}
input,button{font-size:inherit;}
#rec.ov,#sl.ov{width:100%;height:100vh;height:100dvh;max-height:100dvh;overflow-x:hidden;overflow-y:auto;padding-top:calc(env(safe-area-inset-top) + 12px);padding-bottom:calc(env(safe-area-inset-bottom) + 16px);}
#rec video{max-width:100%;}
#sheet.ov{max-height:85vh;max-height:85dvh;overflow-y:auto;padding-bottom:calc(env(safe-area-inset-bottom) + 12px);}
@media(max-width:360px){
 .view{padding-left:11px;padding-right:11px;}
 .ent{gap:6px;}
 .ent button{border-radius:12px;}
}
@media(min-width:600px){
 .view{max-width:680px;margin-left:auto;margin-right:auto;}
}

.stack{display:flex;flex-direction:column;gap:clamp(11px,3vw,16px)}
.appic{width:64px;height:64px;border-radius:15px;object-fit:cover;flex:0 0 auto;border:1px solid #6A4A2A;box-shadow:0 4px 14px #0008}
/* 内置播放器：嵌在影片库页面里 */
.inplayer{display:block;background:#000;border:1px solid #A87939;border-radius:16px;overflow:hidden;box-shadow:0 5px 22px #000c,0 0 12px #D99B4544}
.inplayer[hidden]{display:none}
.inplayer video{display:block;width:100%;aspect-ratio:16/9;max-height:60vh;object-fit:contain;background:#000}
.pinfo{display:flex;gap:10px;align-items:center;padding:10px 12px;background:#100b08}
.pinfo .btn{min-height:38px;padding:0 14px;font-size:13px;flex:0 0 auto}
/* 素材管理 */
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.seg .btn{min-height:42px;padding:0 6px}
.mrow{display:flex;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #2A1F16}.mrow:last-child{border-bottom:0}.mrow .nm{flex:1;min-width:0}.mrow .btn{min-height:38px;padding:0 12px;font-size:13px;flex:0 0 auto}
.song.cur .nm b{color:var(--g)}

else{const d=SD[G.sc]||{};const row=(k,label,f)=>`<div class="mrow"><div class="nm"><b>${label}</b><span class="m">${f?esc(f.name||'已添加')+' · '+fs(f.size):'未添加'}</span></div><button class="btn" data-act="sadd" data-k="${k}">${f?'更换':'添加'}</button>${f?`<button class="btn danger" data-act="sdelf" data-k="${k}">删除</button>`:''}</div>`;
body=`<div class="chips">${SC.map(x=>`<button class="btn ${G.sc===x.id?'on2':''}" data-act="gsc" data-id="${x.id}">${x.n}</button>`).join('')}</div><div class="card">${row('vid','画面视频',d.vid)}${row('aud','环境声音',d.aud)}</div><p class="m">每个场景使用你自己放入的真实画面视频和环境声音（本机保存）。</p>`}
$('#v-mgr').innerHTML=`<button class="btn" style="align-self:flex-start" data-act="tab" data-v="set">‹ 设置</button><h1 style="font-size:26px">素材管理</h1>${seg}${body}`}
function quit(){if(!confirm('确定退出映心影院？'))return;if(R.on&&R.mr&&R.mr.state!=='inactive'){try{R.mr.stop()}catch(e){}}stopSl(1);au.pause();if(R.stream)R.stream.getTracks().forEach(t=>t.stop());try{window.close()}catch(e){}
document.body.innerHTML='<div style="min-height:100vh;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;background:#0E0B09;color:#F5ECE0;font-family:sans-serif"><img src="'+ICON+'" style="width:96px;height:96px;border-radius:22px"><h2>已退出映心影院</h2><p style="color:#A89A8A;font-size:12px">网页无法自行关闭，请直接划走或关闭此页面。</p><button onclick="location.reload()" style="min-height:44px;border-radius:22px;border:0;padding:0 24px;background:#F2B968;font-weight:700">重新进入</button></div>'}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id,d=b.dataset;
if(a==='tab')tab(d.v);else if(a==='vplay')openV(id);else if(a==='vclose')closeV();else if(a==='vdel')delV(id);else if(a==='vexport'){const v=V.items.find(x=>x.id===id);if(v){const blob=await (await fetch(v.url)).blob();await exportFile(blob,v.name)}}else if(a==='vadd')$('#fv').click();
else if(a==='maddf')$('#fm').click();else if(a==='mplay')playS(id);else if(a==='mpp'){if(M.cur==null){const q=queue();if(q.length)playS(q[0].id)}else au.paused?au.play():au.pause()}
else if(a==='mnext')step(1);else if(a==='mprev')step(-1);else if(a==='mpl'){M.pl=id;renderMus()}
else if(a==='mnewpl'){const n=prompt('歌单名称');if(n&&n.trim()){const p={id:uid('p'),name:n.trim(),ids:[]};PL.push(p);sv('pl',PL);G.pl=p.id;renderMus()}}
else if(a==='mdelpl'){if(confirm('删除这个歌单？（歌曲不会被删除）')){const gid=G.pl;PL=PL.filter(p=>p.id!=gid);sv('pl',PL);if(M.pl==gid)M.pl='all';G.pl='all';renderMus()}}
else if(a==='gpl'){G.pl=id;renderMgr()}else if(a==='gt'){G.t=d.t;renderMgr()}else if(a==='gsc'){G.sc=id;renderMgr()}
else if(a==='mtog'){const p=PL.find(x=>x.id==G.pl);if(p){if(p.ids.includes(id))p.ids=p.ids.filter(i=>i!=id);else p.ids.push(id);sv('pl',PL);renderMus()}}
else if(a==='sclose')$('#sheet').classList.remove('on');
else if(a==='mdel'){const s=M.items.find(x=>x.id==id);if(s&&confirm('删除「'+s.name+'」？')){if(M.cur==id){au.pause();M.cur=null}await run(mopen,'songs','readwrite',x=>x.delete(id));PL.forEach(p=>p.ids=p.ids.filter(i=>i!=id));sv('pl',PL);loadM()}}
else if(a==='ssel'){SS.sel=id;renderSleep()}else if(a==='smin'){SS.min=+d.m;renderSleep()}else if(a==='sadd'){G.k=d.k;const f=$('#fs');f.accept=d.k==='vid'?'video/*':'audio/*';f.click()}
else if(a==='sdelf'){if(confirm('删除这个素材？')){const x=SD[G.sc]||{id:G.sc};delete x[d.k];try{await run(mopen,'scenes','readwrite',st=>st.put(x));SD[G.sc]=x;toast('已删除')}catch(err){toast('删除失败')}renderSleep()}}
else if(a==='sgo')startSl();else if(a==='sstop')stopSl();
else if(a==='rec')renderRec();else if(a==='rreturn')returnRec();else if(a==='rclose')closeRec();else if(a==='rstart')startRec();else if(a==='rstop'){if(R.mr&&R.mr.state!=='inactive')R.mr.stop()}
else if(a==='rq'){if(!R.on){R.q=+d.q;renderRec()}}else if(a==='rflip'){if(!R.on){R.face=R.face==='user'?'environment':'user';initCam()}}
else if(a==='rexport'&&R.blob){await exportFile(R.blob,'映心_'+Date.now()+'.'+R.ext)}else if(a==='rsave'){await addVideos([new File([R.blob],'映心_'+Date.now()+'.'+R.ext,{type:R.blob.type})]);$('#rr').innerHTML='<p class="m">已存入影片库</p>'}
else if(a==='rdrop'){if(confirm('放弃这段录像？')){R.blob=null;$('#rr').innerHTML=''}}else if(a==='quit')quit()});
$('#fv').onchange=e=>{addVideos(e.target.files);e.target.value=''};$('#fm').onchange=e=>{addSongs(e.target.files);e.target.value=''};
$('#fs').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const d=SD[G.sc]||{id:G.sc};d[G.k]=f;try{await run(mopen,'scenes','readwrite',s=>s.put(d));SD[G.sc]=d;toast('已保存')}catch(x){toast('保存失败：空间不足')}renderSleep()};
$('#pv').onplay=()=>{if(!au.paused)au.pause()};
renderAll();renderMus();renderSleep();loadV();loadM();loadSc();
</script></body></html>
